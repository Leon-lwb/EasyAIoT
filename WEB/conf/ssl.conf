# HTTPS Server Block
# 自签名证书用于开发/测试，生产环境请替换为 CA 签发的证书
server {
    listen 443 ssl http2;
    server_name localhost;

    # SSL 证书
    ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /usr/share/nginx/html;
    index index.html index.htm;

    resolver 127.0.0.11 valid=30s ipv6=off;

    set $stream_secret "${STREAM_TICKET_SECRET}";

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 代理（与 HTTP 配置一致）
    location /admin-api/ {
        allow all;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_pass http://gateway:48080/admin-api/;
    }

    location ^~ /dev-api/model/ {
        allow all;
        proxy_connect_timeout 300s;
        proxy_send_timeout 20m;
        proxy_read_timeout 20m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://ai-host:5000/model/;
    }

    location ^~ /dev-api/ai/ {
        allow all;
        proxy_pass http://ai-host:5000/;
    }

    location ^~ /dev-api/video/ {
        allow all;
        proxy_connect_timeout 300s;
        proxy_send_timeout 20m;
        proxy_read_timeout 20m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://video-host:6000/video/;
    }

    location ^~ /dev-api/nodeRed/ {
        allow all;
        set $nodered_upstream NodeRED:1880;
        rewrite ^/dev-api/nodeRed/(.*)$ /$1 break;
        proxy_pass http://$nodered_upstream;
    }

    location ^~ /nodeRed {
        allow all;
        set $nodered_upstream NodeRED:1880;
        rewrite ^/nodeRed(.*)$ $1 break;
        proxy_pass http://$nodered_upstream;
    }

    location ^~ /dev-api/srs/ {
        allow all;
        proxy_connect_timeout 300s;
        proxy_send_timeout 20m;
        proxy_read_timeout 20m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://srs-host:1985/;
    }

    location ~* ^/(ai|live)/.+\.(flv|m3u8|ts)$ {
        allow all;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 20m;
        proxy_read_timeout 20m;
        proxy_pass http://srs-host:8080;
    }

    location ^~ /rtp/ {
        allow all;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 20m;
        proxy_read_timeout 20m;
        proxy_pass http://zlm-host:6080;
    }

    location ^~ /api/v1/buckets {
        allow all;
        set $minio_proxy_backend ai-host:5000;
        proxy_pass http://$minio_proxy_backend;
    }

    location /dev-api/ {
        allow all;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_pass http://gateway:48080/admin-api/;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
